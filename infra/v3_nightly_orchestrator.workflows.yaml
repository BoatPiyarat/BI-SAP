# v3_nightly_orchestrator.workflows.yaml — v2 (answers BLOCK docs/reviews/2026-08-02-26a1390-codex.md)
# SOURCE ONLY / Class A. Unit 1 of the unattended V3 nightly orchestrator.
#
# BLOCK-fix map (one round, all five):
#   F1: run.v2 jobs.run now supplies body:{} + explicit connector timeout, and records BOTH the
#       operation name and the completed Execution resource name as provenance.
#   F2: bronze deletion is no longer treated as commitment. verify_load_commitment requires
#       EXACTLY ONE successful BigQuery LOAD job into SAP_LIVE inside the run window, matched to
#       the observed bronze object name, then jobs.get for outputRows/badRecords/terminal state.
#       Zero jobs, multiple jobs, source mismatch, badRecords>0, or errorResult => fail closed.
#   F3: HEALTHY_ZERO is only declared after reading the extract control object (alt=media) and
#       gating caught_up == true AND watermark advanced past the pre-run value. Absence of a
#       bronze object alone is never health.
#   F4: pipeline_run_log rows now use status SUCCESS|FAILED only, and carry counts in rows_out
#       (LOAD outputRows; extract row count when the control object reports it). error_message
#       carries the summary text, matching the 025 convention.
#   F5: mutating CALLs run via jobs.insert + poll to a TERMINAL state. jobComplete=false can no
#       longer strand a running mutation: on deadline the job is cancelled and cancellation is
#       verified before the workflow fails.
#
# Unchanged contract: 20:30 anchor by executing the extract ourselves; at-most-one loader trigger,
# never a retrigger; record -> alert -> raise on every failure; alert-publish failure still raises.
# Deploy/IAM/rollback: docs/design/V3_ORCHESTRATOR_UNIT1_RUNBOOK.md (v2 adds jobs.get/cancel +
# storage.objects.get media read to the SA and requires pinning the control object name).

main:
  params: [args]
  steps:
    - init:
        assign:
          - project: "pacific-plating-282708"
          - region: "asia-southeast1"
          - extract_job: "sap-extract-job"
          - loader_scheduler: "auto_load_sap_data_in_bucket_to_bigquery"
          - bronze_bucket: "rcb-bronze-zone"
          - bronze_prefix: "SAP/production_database/"
          # Deployed extractor control object. It contains last_watermark_utc + updated_at only;
          # caught_up/row-count evidence comes from the exact Cloud Run execution log.
          - control_object: ${default(map.get(args, "control_object"), "SAP/_extract_control/_watermark_state.json")}
          - alert_topic: "projects/pacific-plating-282708/topics/v3-orchestrator-alerts"
          - loader_timeout_seconds: 600
          - bq_call_timeout_seconds: 1800
          - poll_interval_seconds: 15
          - run_started_at: ${time.format(sys.now())}
          - run_id: '${"V3NIGHTLY-" + text.substring(time.format(sys.now()), 0, 19) + "-" + text.substring(uuid.generate(), 0, 8)}'
          - extract_operation: ""
          - extract_execution: ""
          - extract_execution_short: ""
          - bronze_object_name: ""
          - bronze_generation: ""
          - bronze_md5: ""
          - loader_triggered: false
          # Incident 21178: keep production delivery disabled until Unit 5 emits the complete
          # RCL period spine (all periods through TotalPeriods), not only the paid event row.
          - delivery_enabled: false
          # The caller supplies only the authenticated promoter URL. After exactly-one object
          # census, the workflow validates and persists the distinct production/SAP-result names.
          - promotion_service_url: ${default(map.get(args, "promotion_service_url"), "")}
          # Explicit no-write entry used only to prove Workflows -> private Cloud Run permission.
          # It exits before logs, extract, storage, BigQuery, delivery, or post-import work.
          - permission_rehearsal_only: ${default(map.get(args, "permission_rehearsal_only"), false)}
          # A post-import execution must atomically bind its server-assigned identity before any
          # extract/load/mirror side effect. A duplicate execution exits without entering Unit 1.
          - post_import_log_id: ${default(map.get(args, "post_import_log_id"), "")}
          - post_import_claim_token: ${default(map.get(args, "post_import_claim_token"), "")}
          - post_import_mode: ${post_import_log_id != "" or post_import_claim_token != ""}
          - workflow_execution_name: '${"projects/" + sys.get_env("GOOGLE_CLOUD_PROJECT_NUMBER") + "/locations/" + sys.get_env("GOOGLE_CLOUD_LOCATION") + "/workflows/" + sys.get_env("GOOGLE_CLOUD_WORKFLOW_ID") + "/executions/" + sys.get_env("GOOGLE_CLOUD_WORKFLOW_EXECUTION_ID")}'
          - pre_watermark: {}

    - maybe_rehearse_promoter_permission:
        switch:
          - condition: ${permission_rehearsal_only}
            steps:
              - gate_permission_rehearsal_contract:
                  switch:
                    - condition: ${promotion_service_url != "https://sap-delivery-promoter-3uymtccdma-as.a.run.app" or post_import_log_id != "" or post_import_claim_token != ""}
                      raise: "permission rehearsal requires the exact promoter URL and no post-import arguments"
              - invoke_expected_invalid_probe:
                  try:
                    call: http.post
                    args:
                      url: '${promotion_service_url + "/promote"}'
                      auth:
                        type: OIDC
                        audience: ${promotion_service_url}
                      body: {}
                    result: unexpected_rehearsal_success
                  except:
                    as: e
                    steps:
                      - inspect_rehearsal_rejection:
                          assign:
                            - rehearsal_http_code: ${default(map.get(e, "code"), 0)}
                            - rehearsal_error_text: ${json.encode_to_string(default(map.get(e, "body"), ""))}
                      - return_expected_validator_rejection:
                          switch:
                            - condition: '${rehearsal_http_code == 400 and text.match_regex(rehearsal_error_text, "missing required field: archive_bucket")}'
                              return:
                                permission_rehearsal: "PROMOTER_AUTH_REACHED_VALIDATOR"
                                http_code: ${rehearsal_http_code}
                                production_write_expected: false
                      - raise_unexpected_rehearsal_failure:
                          raise: '${"promoter permission rehearsal failed before expected validator response; HTTP " + string(rehearsal_http_code)}'
              - reject_unexpected_rehearsal_success:
                  raise: "invalid permission rehearsal unexpectedly succeeded"

    - maybe_bind_post_import_execution:
        switch:
          - condition: ${post_import_mode}
            steps:
              - gate_post_import_contract:
                  switch:
                    - condition: ${post_import_log_id == "" or post_import_claim_token == ""}
                      raise: "post-import execution requires both log ID and claim token"
              - bind_post_import_execution:
                  call: bind_post_import
                  args:
                    project: ${project}
                    log_id: ${post_import_log_id}
                    claim_token: ${post_import_claim_token}
                    workflow_execution_name: ${workflow_execution_name}
                  result: post_import_binding
              - exit_duplicate_post_import_execution:
                  switch:
                    - condition: ${post_import_binding.execution_name != workflow_execution_name}
                      return: '${"DUPLICATE_NOOP:" + post_import_binding.execution_name}'

    - log_start:
        call: write_run_log
        args:
          project: ${project}
          run_id: ${run_id}
          step: "UNIT1_START"
          status: "SUCCESS"
          rows_out: null
          detail: '${"anchored run started at " + run_started_at}'

    # ---------------- pre-extract gates ----------------
    - read_pre_watermark:
        call: read_control_object
        args:
          project: ${project}
          bucket: ${bronze_bucket}
          object: ${control_object}
        result: pre_watermark
    - list_bronze_pre:
        call: googleapis.storage.v1.objects.list
        args:
          bucket: ${bronze_bucket}
          prefix: ${bronze_prefix}
        result: bronze_pre
    - count_bronze_pre:
        assign:
          - pre_count: ${len(default(map.get(bronze_pre, "items"), []))}
    - gate_bronze_pre:
        switch:
          - condition: ${pre_count > 1}
            steps:
              - fail_pre:
                  call: fail_closed
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    step: "BRONZE_PRE_GATE"
                    reason: '${"found " + string(pre_count) + " pending bronze objects; refusing to combine batches"}'

    # ---------------- extract (F1: body + timeout + execution provenance) ----------------
    - maybe_extract:
        switch:
          - condition: ${pre_count == 0}
            steps:
              - run_extract:
                  try:
                    call: googleapis.run.v2.projects.locations.jobs.run
                    args:
                      name: '${"projects/" + project + "/locations/" + region + "/jobs/" + extract_job}'
                      body: {}
                      connector_params:
                        timeout: 3600
                    result: extract_op
                  except:
                    as: e
                    steps:
                      - fail_extract:
                          call: fail_closed
                          args:
                            project: ${project}
                            run_id: ${run_id}
                            alert_topic: ${alert_topic}
                            step: "EXTRACT"
                            reason: '${"extract execution failed: " + json.encode_to_string(e)}'
              - record_extract:
                  assign:
                    - extract_operation: ${default(map.get(extract_op, "name"), "unknown-operation")}
                    - extract_execution: ${default(map.get(extract_op, ["response", "name"]), "unknown-execution")}
              - record_extract_short:
                  assign:
                    - execution_parts: ${text.split(extract_execution, "/")}
                    - extract_execution_short: ${execution_parts[len(execution_parts) - 1]}
              - log_extract:
                  call: write_run_log
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    step: "EXTRACT_DONE"
                    status: "SUCCESS"
                    rows_out: null
                    detail: '${"operation=" + extract_operation + "; execution=" + extract_execution}'
          - condition: ${pre_count == 1}
            steps:
              - log_skip_extract:
                  call: write_run_log
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    step: "EXTRACT_SKIPPED"
                    status: "SUCCESS"
                    rows_out: null
                    detail: "one pending bronze object; re-entry without a second batch"

    # ---------------- post-extract census ----------------
    - list_bronze_post:
        call: googleapis.storage.v1.objects.list
        args:
          bucket: ${bronze_bucket}
          prefix: ${bronze_prefix}
        result: bronze_post
    - census_post:
        assign:
          - post_items: ${default(map.get(bronze_post, "items"), [])}
          - post_count: ${len(post_items)}
    - gate_bronze_post:
        switch:
          - condition: ${post_count > 1}
            steps:
              - fail_post:
                  call: fail_closed
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    step: "BRONZE_POST_GATE"
                    reason: '${"extract window left " + string(post_count) + " bronze objects; refusing loader trigger"}'
          - condition: ${post_count == 1}
            steps:
              - record_object:
                  assign:
                    - bronze_object_name: ${default(map.get(post_items[0], "name"), "")}
                    - bronze_generation: ${string(default(map.get(post_items[0], "generation"), ""))}
                    - bronze_md5: ${default(map.get(post_items[0], "md5Hash"), "")}
              - log_object:
                  call: write_run_log
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    step: "BRONZE_OBJECT"
                    status: "SUCCESS"
                    rows_out: null
                    detail: '${"name=" + bronze_object_name + "; generation=" + bronze_generation + "; md5=" + bronze_md5}'
              - trigger_loader_once:
                  call: googleapis.cloudscheduler.v1.projects.locations.jobs.run
                  args:
                    name: '${"projects/" + project + "/locations/" + region + "/jobs/" + loader_scheduler}'
              - mark_loader:
                  assign:
                    - loader_triggered: true
              - wait_for_consumption:
                  call: wait_bronze_empty
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    bucket: ${bronze_bucket}
                    prefix: ${bronze_prefix}
                    deadline_seconds: ${loader_timeout_seconds}
                    poll_seconds: ${poll_interval_seconds}
              # F2: consumption observed; now demand the LOAD commitment itself.
              - verify_commitment:
                  call: verify_load_commitment
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    run_started_at: ${run_started_at}
                    bronze_object_name: ${bronze_object_name}
                    bronze_generation: ${bronze_generation}
          - condition: ${post_count == 0}
            steps:
              # F3: zero objects is only healthy when the extractor's own evidence says so.
              - verify_zero:
                  call: verify_healthy_zero
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    bucket: ${bronze_bucket}
                    object: ${control_object}
                    pre_watermark: ${pre_watermark}
                    ran_extract: ${pre_count == 0}
                    extract_job: ${extract_job}
                    extract_execution: ${extract_execution_short}
                    run_started_at: ${run_started_at}

    # ---------------- mirror refresh (F5: terminal-polled mutating jobs) ----------------
    - refresh_mirror_doc:
        call: run_bq_call
        args:
          project: ${project}
          run_id: ${run_id}
          alert_topic: ${alert_topic}
          step: "MIRROR_DOC_REFRESH"
          statement: "CALL `pacific-plating-282708.sap_integration_v3.sp_refresh_sap_mirror_doc_incremental`('NIGHTLY:orchestrator');"
          timeout_seconds: ${bq_call_timeout_seconds}
    - refresh_mirror_state:
        call: run_bq_call
        args:
          project: ${project}
          run_id: ${run_id}
          alert_topic: ${alert_topic}
          step: "MIRROR_STATE_REFRESH"
          statement: "CALL `pacific-plating-282708.sap_integration_v3.sp_refresh_sap_mirror_state`('NIGHTLY:orchestrator');"
          timeout_seconds: ${bq_call_timeout_seconds}

    - log_complete:
        call: write_run_log
        args:
          project: ${project}
          run_id: ${run_id}
          step: "UNIT1_COMPLETE"
          status: "SUCCESS"
          rows_out: null
          detail: '${"extract_execution=" + extract_execution + "; loader_triggered=" + string(loader_triggered) + "; bronze=" + bronze_object_name + "@" + bronze_generation}'
    - stop_after_post_import_unit1:
        switch:
          - condition: ${post_import_mode}
            steps:
              - reconcile_post_import_rows:
                  call: reconcile_post_import
                  args:
                    project: ${project}
                    child_pipeline_run_id: ${run_id}
                    log_id: ${post_import_log_id}
                    export_run_id: ${post_import_binding.export_run_id}
                    sap_file_name: ${post_import_binding.sap_file_name}
                  result: post_import_reconciliation
              - gate_post_import_residual:
                  switch:
                    - condition: ${post_import_reconciliation.pending_rows > 0}
                      steps:
                        - complete_post_import_human_action:
                            call: complete_post_import
                            args:
                              project: ${project}
                              log_id: ${post_import_log_id}
                              workflow_execution_name: ${workflow_execution_name}
                              terminal_status: "HUMAN_ACTION"
                              error_template: "ROW_RECONCILIATION_RESIDUAL"
                        - alert_post_import_residual:
                            call: fail_closed
                            args:
                              project: ${project}
                              run_id: ${run_id}
                              alert_topic: ${alert_topic}
                              step: "POST_IMPORT_RECONCILIATION"
                              reason: '${"row conservation left " + string(post_import_reconciliation.pending_rows) + " PENDING_ACK identities for LogID " + post_import_log_id}'
              # pending_rows==0 here means DDL 073 already reached a terminal manifest
              # (ACKNOWLEDGED/PARTIAL_REJECT/REJECTED), so the deferred nonzero-export snapshot
              # (docs/FINDINGS_DAILY_COMPLETENESS_RUNTIME_GAP_20260805.md step 2) is now safe.
              # The snapshot must be built for the ORIGINAL outbound pipeline_run_id, not this
              # post-import child's own run_id (step 3) — derive it from the delivered export.
              - resolve_original_pipeline_run_id:
                  call: derive_original_pipeline_run_id
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    export_run_id: ${post_import_binding.export_run_id}
                  result: original_pipeline_run_id
              - dispatch_terminal_export_snapshot:
                  call: run_bq_call
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    step: "DAILY_COMPLETENESS_SNAPSHOT"
                    statement: '${"CALL `pacific-plating-282708.sap_integration_v3.sp_build_v3_daily_completeness_snapshot`(\u0027" + original_pipeline_run_id + "\u0027);"}'
                    timeout_seconds: ${bq_call_timeout_seconds}
              # Codex review docs/reviews/2026-08-11-28686d6-codex.md: this used to run before
              # origin resolution/snapshot dispatch, so a later failure there could leave a
              # contradictory SUCCEEDED outbox record next to a never-built snapshot. Moved here,
              # after both have actually succeeded.
              - complete_post_import_success:
                  call: complete_post_import
                  args:
                    project: ${project}
                    log_id: ${post_import_log_id}
                    workflow_execution_name: ${workflow_execution_name}
                    terminal_status: "SUCCEEDED"
                    error_template: null
              - return_post_import:
                  return: ${run_id}
    # Units 2-5 share this exact run_id. The SQL wrapper evaluates notification and release gates
    # every night, treats zero delivery rows as a healthy no-file outcome, and writes archive only.
    # Exact-generation production promotion and SAP ACK remain Unit 6 gates.
    - run_units_2_5:
        call: run_bq_call
        args:
          project: ${project}
          run_id: ${run_id}
          alert_topic: ${alert_topic}
          step: "UNITS_2_5_ARCHIVE"
          statement: '${"CALL `pacific-plating-282708.sap_integration_v3.sp_run_v3_units2_5`(\u0027" + run_id + "\u0027);"}'
          timeout_seconds: ${bq_call_timeout_seconds}
    # Healthy-zero daily-completeness snapshot dispatch (docs/FINDINGS_DAILY_COMPLETENESS_RUNTIME_GAP_20260805.md
    # step 2). A nonzero export must NOT snapshot here -- it is deferred until post-import row
    # reconciliation reaches a terminal manifest (see reconcile_post_import / dispatch_terminal_export_snapshot
    # above). 067_v3_daily_completeness_snapshot.sql's own gate also fails closed if this is ever
    # called for a nonzero, non-terminal export, independent of this pre-check.
    - count_exports_for_snapshot:
        call: count_export_runs_for_pipeline
        args:
          project: ${project}
          run_id: ${run_id}
          alert_topic: ${alert_topic}
        result: export_run_count
    - maybe_snapshot_healthy_zero:
        switch:
          - condition: ${export_run_count == 0}
            steps:
              - dispatch_healthy_zero_snapshot:
                  call: run_bq_call
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    step: "DAILY_COMPLETENESS_SNAPSHOT"
                    statement: '${"CALL `pacific-plating-282708.sap_integration_v3.sp_build_v3_daily_completeness_snapshot`(\u0027" + run_id + "\u0027);"}'
                    timeout_seconds: ${bq_call_timeout_seconds}
    - maybe_promote_exact_archive:
        switch:
          - condition: ${delivery_enabled}
            steps:
              - require_delivery_contract:
                  switch:
                    - condition: ${promotion_service_url == ""}
                      steps:
                        - fail_missing_delivery_contract:
                            call: fail_closed
                            args:
                              project: ${project}
                              run_id: ${run_id}
                              alert_topic: ${alert_topic}
                              step: "UNIT6_DELIVERY_CONTRACT"
                              reason: "delivery requires an explicit promotion_service_url"
              - promote_exact_archive:
                  call: promote_daily_archive
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    promotion_service_url: ${promotion_service_url}
                  result: delivery
              - gate_delivery_rows:
                  switch:
                    - condition: ${not delivery.has_delivery}
                      next: done
              - build_delivery_statement:
                  assign:
                    - delivery_call_head: '${"CALL `pacific-plating-282708.sap_integration_v3.sp_mark_v3_exact_delivery`(\u0027" + run_id + "\u0027,\u0027" + delivery.export_run_id + "\u0027,\u0027" + delivery.archive_uri + "\u0027,\u0027" + delivery.archive_generation + "\u0027,"}'
                    - delivery_call_tail: '${"\u0027" + delivery.production_uri + "\u0027,\u0027" + delivery.production_generation + "\u0027," + string(delivery.size_bytes) + ",\u0027" + delivery.crc32c + "\u0027," + string(delivery.header_column_count) + "," + string(delivery.data_row_count) + ",\u0027" + delivery.production_file_name + "\u0027,\u0027" + delivery.sap_result_file_name + "\u0027,\u0027" + delivery.file_sha256 + "\u0027);"}'
              - persist_delivery:
                  call: run_bq_call
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    step: "UNIT6_DELIVERED"
                    statement: '${delivery_call_head + delivery_call_tail}'
                    timeout_seconds: ${bq_call_timeout_seconds}
    - done:
        return: ${run_id}

# The workflow, not the dispatcher, owns the final execution-name bind. The Executions API assigns
# the name server-side, so this must be the first operation in post-import mode. DDL 072 returns the
# winning name; duplicate executions exit before Unit 1 instead of repeating extract/load/mirror.
bind_post_import:
  params: [project, log_id, claim_token, workflow_execution_name]
  steps:
    - bind:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            query: "CALL `pacific-plating-282708.sap_integration_v3.sp_bind_v3_post_import_execution`(@log_id,@claim_token,@workflow_execution_name)"
            useLegacySql: false
            location: "asia-southeast1"
            timeoutMs: 60000
            parameterMode: "NAMED"
            queryParameters:
              - name: "log_id"
                parameterType: { type: "STRING" }
                parameterValue: { value: '${log_id}' }
              - name: "claim_token"
                parameterType: { type: "STRING" }
                parameterValue: { value: '${claim_token}' }
              - name: "workflow_execution_name"
                parameterType: { type: "STRING" }
                parameterValue: { value: '${workflow_execution_name}' }
        result: binding
    - gate_complete:
        switch:
          - condition: ${not default(map.get(binding, "jobComplete"), false)}
            raise: "post-import execution bind did not complete synchronously"
    - gate_one_row:
        assign:
          - rows: ${default(map.get(binding, "rows"), [])}
    - require_one_row:
        switch:
          - condition: ${len(rows) != 1}
            raise: "post-import execution bind returned an unexpected row count"
    - out:
        return:
          execution_name: ${rows[0].f[1].v}
          export_run_id: ${rows[0].f[2].v}
          sap_file_name: ${rows[0].f[3].v}

complete_post_import:
  params: [project, log_id, workflow_execution_name, terminal_status, error_template]
  steps:
    - complete:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            query: "CALL `pacific-plating-282708.sap_integration_v3.sp_complete_v3_post_import_refresh`(@log_id,@workflow_execution_name,@terminal_status,@error_template)"
            useLegacySql: false
            location: "asia-southeast1"
            timeoutMs: 60000
            parameterMode: "NAMED"
            queryParameters:
              - name: "log_id"
                parameterType: { type: "STRING" }
                parameterValue: { value: '${log_id}' }
              - name: "workflow_execution_name"
                parameterType: { type: "STRING" }
                parameterValue: { value: '${workflow_execution_name}' }
              - name: "terminal_status"
                parameterType: { type: "STRING" }
                parameterValue: { value: '${terminal_status}' }
              - name: "error_template"
                parameterType: { type: "STRING" }
                parameterValue: { value: '${error_template}' }
        result: completion
    - gate_complete:
        switch:
          - condition: ${not default(map.get(completion, "jobComplete"), false)}
            raise: "post-import terminal completion did not complete synchronously"
    - out:
        return: true

reconcile_post_import:
  params: [project, child_pipeline_run_id, log_id, export_run_id, sap_file_name]
  steps:
    - reconcile:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            query: "CALL `pacific-plating-282708.sap_integration_v3.sp_reconcile_v3_post_import_rows`(@child_pipeline_run_id,@log_id,@export_run_id,@sap_file_name)"
            useLegacySql: false
            location: "asia-southeast1"
            timeoutMs: 60000
            parameterMode: "NAMED"
            queryParameters:
              - name: "child_pipeline_run_id"
                parameterType: { type: "STRING" }
                parameterValue: { value: '${child_pipeline_run_id}' }
              - name: "log_id"
                parameterType: { type: "STRING" }
                parameterValue: { value: '${log_id}' }
              - name: "export_run_id"
                parameterType: { type: "STRING" }
                parameterValue: { value: '${export_run_id}' }
              - name: "sap_file_name"
                parameterType: { type: "STRING" }
                parameterValue: { value: '${sap_file_name}' }
        result: reconciliation
    - gate_complete:
        switch:
          - condition: ${not default(map.get(reconciliation, "jobComplete"), false)}
            raise: "post-import row reconciliation did not complete synchronously"
    - read_rows:
        assign:
          - rows: ${default(map.get(reconciliation, "rows"), [])}
    - require_one_row:
        switch:
          - condition: ${len(rows) != 1}
            raise: "post-import row reconciliation returned an unexpected row count"
    - out:
        return:
          total_rows: ${int(rows[0].f[0].v)}
          acknowledged_rows: ${int(rows[0].f[1].v)}
          rejected_rows: ${int(rows[0].f[2].v)}
          pending_rows: ${int(rows[0].f[3].v)}
          manifest_status: ${rows[0].f[4].v}

# Unit 6 daily-completeness dispatch support (docs/FINDINGS_DAILY_COMPLETENESS_RUNTIME_GAP_20260805.md).
# count_export_runs_for_pipeline decides whether a normal-mode run may snapshot immediately (zero
# exports). derive_original_pipeline_run_id lets a post-import-mode run, once its reconciliation is
# terminal, bind back to the ORIGINAL outbound pipeline_run_id (never the post-import child's own
# run_id, per finding step 3) before calling the snapshot procedure. Both join predicates mirror
# 067_v3_daily_completeness_snapshot.sql's own _exports CTE exactly (order_item, period, charge_id,
# payload_hash) so these pre-checks can never disagree with what the procedure itself computes.
count_export_runs_for_pipeline:
  params: [project, run_id, alert_topic]
  steps:
    - count_exports:
        try:
          call: googleapis.bigquery.v2.jobs.query
          args:
            projectId: ${project}
            body:
              query: "SELECT COUNT(DISTINCT a.export_run_id) FROM `pacific-plating-282708.sap_integration_v3.export_archive` a JOIN `pacific-plating-282708.sap_integration_v3.v3_unit5_payload_identity` i ON i.order_item=a.order_item AND i.period=a.period AND i.charge_id=a.charge_id AND i.payload_hash=a.payload_hash WHERE i.pipeline_run_id=@run_id"
              useLegacySql: false
              location: "asia-southeast1"
              maximumBytesBilled: "21474836480"
              parameterMode: "NAMED"
              queryParameters:
                - name: "run_id"
                  parameterType: { type: "STRING" }
                  parameterValue: { value: '${run_id}' }
          result: export_count_query
        except:
          as: e
          steps:
            - fail_query:
                call: fail_closed
                args:
                  project: ${project}
                  run_id: ${run_id}
                  alert_topic: ${alert_topic}
                  step: "DAILY_COMPLETENESS_EXPORT_COUNT"
                  reason: '${"export-run count query failed: " + json.encode_to_string(e)}'
    # Codex review docs/reviews/2026-08-11-28686d6-codex.md: this previously dereferenced rows[0]
    # without checking jobComplete or row shape, bypassing the required fail_closed contract on an
    # async/malformed result. Both gates now route through fail_closed like every other CALL step.
    - gate_complete:
        switch:
          - condition: ${not default(map.get(export_count_query, "jobComplete"), false)}
            steps:
              - fail_incomplete:
                  call: fail_closed
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    step: "DAILY_COMPLETENESS_EXPORT_COUNT"
                    reason: "export-run count query did not complete synchronously"
    - read_rows:
        assign:
          - count_rows: ${default(map.get(export_count_query, "rows"), [])}
    - require_one_row:
        switch:
          - condition: ${len(count_rows) != 1}
            steps:
              - fail_shape:
                  call: fail_closed
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    step: "DAILY_COMPLETENESS_EXPORT_COUNT"
                    reason: '${"export-run count query returned an unexpected row count: " + string(len(count_rows))}'
    - read_fields:
        assign:
          - count_fields: ${default(map.get(count_rows[0], "f"), [])}
    - require_one_field:
        switch:
          - condition: ${len(count_fields) != 1}
            steps:
              - fail_field_shape:
                  call: fail_closed
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    step: "DAILY_COMPLETENESS_EXPORT_COUNT"
                    reason: '${"export-run count query returned an unexpected field count: " + string(len(count_fields))}'
    - read_value:
        assign:
          - count_value_text: ${string(default(map.get(count_fields[0], "v"), ""))}
    - require_nonnegative_integer:
        switch:
          - condition: ${count_value_text == "" or not text.match_regex(count_value_text, "^[0-9]+$")}
            steps:
              - fail_count_value:
                  call: fail_closed
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    step: "DAILY_COMPLETENESS_EXPORT_COUNT"
                    reason: "export-run count query returned a NULL or non-integer count"
    - out:
        return: ${int(count_value_text)}

derive_original_pipeline_run_id:
  params: [project, run_id, alert_topic, export_run_id]
  steps:
    - lookup:
        try:
          call: googleapis.bigquery.v2.jobs.query
          args:
            projectId: ${project}
            body:
              query: "SELECT DISTINCT i.pipeline_run_id FROM `pacific-plating-282708.sap_integration_v3.export_archive` a JOIN `pacific-plating-282708.sap_integration_v3.v3_unit5_payload_identity` i ON i.order_item=a.order_item AND i.period=a.period AND i.charge_id=a.charge_id AND i.payload_hash=a.payload_hash WHERE a.export_run_id=@export_run_id"
              useLegacySql: false
              location: "asia-southeast1"
              maximumBytesBilled: "21474836480"
              parameterMode: "NAMED"
              queryParameters:
                - name: "export_run_id"
                  parameterType: { type: "STRING" }
                  parameterValue: { value: '${export_run_id}' }
          result: origin_query
        except:
          as: e
          steps:
            - fail_query:
                call: fail_closed
                args:
                  project: ${project}
                  run_id: ${run_id}
                  alert_topic: ${alert_topic}
                  step: "DAILY_COMPLETENESS_ORIGIN_LOOKUP"
                  reason: '${"original pipeline_run_id lookup query failed: " + json.encode_to_string(e)}'
    # Codex review docs/reviews/2026-08-11-28686d6-codex.md: cardinality was checked but
    # jobComplete was not, so an async/incomplete result could bypass fail_closed.
    - gate_complete:
        switch:
          - condition: ${not default(map.get(origin_query, "jobComplete"), false)}
            steps:
              - fail_incomplete:
                  call: fail_closed
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    step: "DAILY_COMPLETENESS_ORIGIN_LOOKUP"
                    reason: "original pipeline_run_id lookup query did not complete synchronously"
    - read_rows:
        assign:
          - origin_rows: ${default(map.get(origin_query, "rows"), [])}
    - require_exactly_one:
        switch:
          - condition: ${len(origin_rows) != 1}
            steps:
              - fail_ambiguous_origin:
                  call: fail_closed
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    step: "DAILY_COMPLETENESS_ORIGIN_LOOKUP"
                    reason: '${"expected exactly one original pipeline_run_id for export_run_id " + export_run_id + "; found " + string(len(origin_rows))}'
    - read_fields:
        assign:
          - origin_fields: ${default(map.get(origin_rows[0], "f"), [])}
    - require_one_field:
        switch:
          - condition: ${len(origin_fields) != 1}
            steps:
              - fail_field_shape:
                  call: fail_closed
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    step: "DAILY_COMPLETENESS_ORIGIN_LOOKUP"
                    reason: '${"original pipeline_run_id lookup returned an unexpected field count: " + string(len(origin_fields))}'
    - read_value:
        assign:
          - original_pipeline_run_id: ${string(default(map.get(origin_fields[0], "v"), ""))}
    - require_nonblank_value:
        switch:
          - condition: ${original_pipeline_run_id == ""}
            steps:
              - fail_blank_origin:
                  call: fail_closed
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    step: "DAILY_COMPLETENESS_ORIGIN_LOOKUP"
                    reason: "original pipeline_run_id lookup returned a NULL or blank value"
    - out:
        return: ${original_pipeline_run_id}

# Exact-generation production promotion. Zero archive rows is a healthy no-file night. Any
# ambiguous ledger/object or copy mismatch fails closed before DELIVERED is persisted.
promote_daily_archive:
  params: [project, run_id, alert_topic, promotion_service_url]
  steps:
    - find_archive:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            query: "WITH x AS (SELECT DISTINCT a.export_run_id,a.archive_uri,a.file_name FROM `pacific-plating-282708.sap_integration_v3.export_archive` a JOIN `pacific-plating-282708.sap_integration_v3.v3_unit5_payload_identity` i USING(order_item,period,charge_id) WHERE i.pipeline_run_id=@run_id AND i.file_role='NEWPAYMENT' AND a.delivery_status='ARCHIVED_PENDING_OBJECT_METADATA') SELECT TO_JSON_STRING(STRUCT(export_run_id,archive_uri,file_name)) FROM x"
            useLegacySql: false
            location: "asia-southeast1"
            maximumBytesBilled: "21474836480"
            parameterMode: "NAMED"
            queryParameters:
              - name: "run_id"
                parameterType: { type: "STRING" }
                parameterValue: { value: '${run_id}' }
        result: archive_query
    - archive_census:
        assign:
          - archive_rows: ${default(map.get(archive_query, "rows"), [])}
          - archive_count: ${len(archive_rows)}
    - no_archive:
        switch:
          - condition: ${archive_count == 0}
            return:
              has_delivery: false
          - condition: ${archive_count != 1}
            steps:
              - fail_archive_count:
                  call: fail_closed
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    step: "UNIT6_ARCHIVE_LEDGER"
                    reason: '${"expected zero or one archive manifest; found " + string(archive_count)}'
    - decode_archive:
        assign:
          - archive_info: ${json.decode(archive_rows[0].f[0].v)}
    - derive_prefix:
        assign:
          - archive_object_prefix: ${text.replace_all(text.replace_all(archive_info.archive_uri, "gs://rcb-bronze-zone/", ""), "*.csv", "")}
    - list_archive:
        call: googleapis.storage.v1.objects.list
        args:
          bucket: "rcb-bronze-zone"
          prefix: ${archive_object_prefix}
        result: archive_objects
    - object_census:
        assign:
          - objects: ${default(map.get(archive_objects, "items"), [])}
          - object_count: ${len(objects)}
    - gate_object:
        switch:
          - condition: ${object_count != 1}
            steps:
              - fail_object_count:
                  call: fail_closed
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    step: "UNIT6_ARCHIVE_OBJECT"
                    reason: '${"expected exactly one archive object; found " + string(object_count)}'
    - source_metadata:
        assign:
          - source_name: ${objects[0].name}
          - source_generation: ${string(objects[0].generation)}
          - source_parts: ${text.split(objects[0].name, "/")}
    - derive_delivery_names:
        assign:
          - production_file_name: ${source_parts[len(source_parts) - 1]}
          - sap_result_file_name: '${"RCB_MOTOR_" + source_parts[len(source_parts) - 1]}'
    - gate_delivery_names:
        switch:
          - condition: ${not text.match_regex(production_file_name, "^INSURANCE_RCB_[A-Za-z0-9._-]*[.]csv$") or not text.match_regex(sap_result_file_name, "^RCB_MOTOR_INSURANCE_RCB_[A-Za-z0-9._-]*[.]csv$")}
            steps:
              - fail_delivery_names:
                  call: fail_closed
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    step: "UNIT6_FILENAME_POLICY"
                    reason: "production and SAP-result filenames do not satisfy the approved two-name policy"
    - destination_metadata:
        assign:
          - destination_name: '${"RCB_MOTOR/" + production_file_name}'
          - expected_production_uri: '${"gs://interface-file/" + destination_name}'
    - promote_and_hash_exact_generation:
        call: http.post
        args:
          url: '${promotion_service_url + "/promote"}'
          auth:
            type: OIDC
            audience: ${promotion_service_url}
          body:
            archive_bucket: "rcb-bronze-zone"
            archive_object: ${source_name}
            archive_generation: ${source_generation}
            production_bucket: "interface-file"
            production_object: ${destination_name}
            production_file_name: ${production_file_name}
        result: promotion_response
    - inspect_promotion:
        assign:
          - promotion: ${promotion_response.body}
          - promoted_archive_uri: ${default(map.get(promotion, "archive_uri"), "")}
          - promoted_archive_generation: ${string(default(map.get(promotion, "archive_generation"), ""))}
          - production_uri: ${default(map.get(promotion, "production_uri"), "")}
          - dest_generation: ${string(default(map.get(promotion, "production_generation"), ""))}
          - dest_size: ${int(default(map.get(promotion, "size_bytes"), "0"))}
          - dest_crc: ${default(map.get(promotion, "crc32c"), "")}
          - promoted_production_file_name: ${default(map.get(promotion, "production_file_name"), "")}
          - file_sha256: ${default(map.get(promotion, "file_sha256"), "")}
          - header_column_count: ${int(default(map.get(promotion, "header_column_count"), "0"))}
          - data_row_count: ${int(default(map.get(promotion, "data_row_count"), "0"))}
    - gate_promotion:
        switch:
          - condition: ${promoted_archive_uri != "gs://rcb-bronze-zone/" + source_name or promoted_archive_generation != source_generation or production_uri != expected_production_uri or dest_generation == "" or dest_size <= 0 or dest_crc == "" or promoted_production_file_name != production_file_name or file_sha256 == "" or header_column_count != 56 or data_row_count <= 0}
            steps:
              - fail_promotion:
                  call: fail_closed
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    step: "UNIT6_EXACT_PROMOTION"
                    reason: "promotion response did not bind the requested source generation, production filename, destination, and hash"
    - output:
        return:
          has_delivery: true
          export_run_id: ${archive_info.export_run_id}
          archive_uri: ${promoted_archive_uri}
          archive_generation: ${source_generation}
          production_uri: ${production_uri}
          production_generation: ${dest_generation}
          size_bytes: ${dest_size}
          crc32c: ${dest_crc}
          production_file_name: ${promoted_production_file_name}
          sap_result_file_name: ${sap_result_file_name}
          file_sha256: ${file_sha256}
          header_column_count: ${header_column_count}
          data_row_count: ${data_row_count}

# ----------------------------------------------------------------------
# F3 support: read the extract control object content (alt=media) with the
# workflow SA's OAuth2 token. Any read/parse failure returns {} and the
# healthy-zero gate then fails closed on missing evidence.
# ----------------------------------------------------------------------
read_control_object:
  params: [project, bucket, object]
  steps:
    - fetch:
        try:
          call: http.get
          args:
            url: '${"https://storage.googleapis.com/storage/v1/b/" + bucket + "/o/" + text.url_encode(object) + "?alt=media"}'
            auth:
              type: OAuth2
          result: resp
        except:
          as: e
          steps:
            - empty:
                return: {}
    - parsed:
        return: ${map.get(resp, "body")}

# ----------------------------------------------------------------------
# F3: healthy-zero gate. The real control object contains last_watermark_utc only.
# Require (a) this run executed the extract, (b) watermark advanced, and (c) the
# exact Cloud Run execution emitted one success marker containing 0 rows and caught_up=True.
# ----------------------------------------------------------------------
verify_healthy_zero:
  params: [project, run_id, alert_topic, bucket, object, pre_watermark, ran_extract, extract_job, extract_execution, run_started_at]
  steps:
    - gate_ran:
        switch:
          - condition: ${not ran_extract}
            steps:
              - fail_no_extract:
                  call: fail_closed
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    step: "HEALTHY_ZERO_GATE"
                    reason: "re-entry run found zero bronze objects without executing extract; cannot certify health"
    - read_post:
        call: read_control_object
        args:
          project: ${project}
          bucket: ${bucket}
          object: ${object}
        result: post_watermark
    - extract_fields:
        assign:
          - pre_wm: ${default(map.get(pre_watermark, "last_watermark_utc"), "")}
          - post_wm: ${default(map.get(post_watermark, "last_watermark_utc"), "")}
    - read_success_log:
        call: http.post
        args:
          url: "https://logging.googleapis.com/v2/entries:list"
          auth:
            type: OAuth2
          body:
            resourceNames:
              - '${"projects/" + project}'
            filter: '${"resource.type=\"cloud_run_job\" AND resource.labels.job_name=\"" + extract_job + "\" AND labels.\"run.googleapis.com/execution_name\"=\"" + extract_execution + "\" AND timestamp>=\"" + run_started_at + "\" AND textPayload:\"success:\" AND textPayload:\"0 rows\" AND textPayload:\"caught_up=True\""}'
            orderBy: "timestamp desc"
            pageSize: 2
        result: success_logs
    - log_census:
        assign:
          - success_entries: ${default(map.get(success_logs, ["body", "entries"]), [])}
          - success_count: ${len(success_entries)}
    - gate_signals:
        switch:
          - condition: ${post_wm == "" or not (time.parse(post_wm) > time.parse(pre_wm)) or success_count != 1}
            steps:
              - fail_signals:
                  call: fail_closed
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    step: "HEALTHY_ZERO_GATE"
                    reason: '${"zero-object night lacks health evidence: success_log_count=" + string(success_count) + "; execution=" + extract_execution + "; pre_wm=" + pre_wm + "; post_wm=" + post_wm + " (login-failure shape or unreadable evidence)"}'
    - log_zero:
        call: write_run_log
        args:
          project: ${project}
          run_id: ${run_id}
          step: "HEALTHY_ZERO"
          status: "SUCCESS"
          rows_out: 0
          detail: '${"success marker: 0 rows, caught_up=True; execution=" + extract_execution + "; watermark " + pre_wm + " -> " + post_wm + "; loader not triggered"}'
    - out:
        return: true

# ----------------------------------------------------------------------
# F2: exactly-one LOAD commitment. INFORMATION_SCHEMA finds candidate LOAD jobs
# in the run window targeting SAP_LIVE; jobs.get supplies terminal state,
# outputRows, badRecords, and sourceUris for the object match.
# ----------------------------------------------------------------------
verify_load_commitment:
  params: [project, run_id, alert_topic, run_started_at, bronze_object_name, bronze_generation]
  steps:
    - find_jobs:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            query: "SELECT job_id FROM `pacific-plating-282708.region-asia-southeast1.INFORMATION_SCHEMA.JOBS_BY_PROJECT` WHERE job_type='LOAD' AND destination_table.dataset_id='sap_integration_v2' AND destination_table.table_id='SAP_LIVE' AND creation_time >= TIMESTAMP(@run_started_at) AND state='DONE'"
            useLegacySql: false
            location: "asia-southeast1"
            maximumBytesBilled: "21474836480"
            timeoutMs: 60000
            parameterMode: "NAMED"
            queryParameters:
              - name: "run_started_at"
                parameterType: { type: "STRING" }
                parameterValue: { value: '${run_started_at}' }
        result: found
    - census_jobs:
        assign:
          - rows: ${default(map.get(found, "rows"), [])}
          - n_jobs: ${len(rows)}
    - gate_exactly_one:
        switch:
          - condition: ${n_jobs != 1}
            steps:
              - fail_count:
                  call: fail_closed
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    step: "LOAD_COMMITMENT"
                    reason: '${"expected exactly one LOAD job into SAP_LIVE in the run window; found " + string(n_jobs) + " (zero = consumption without commitment; multiple = retry amplification shape)"}'
    - job_id:
        assign:
          - load_job_id: ${rows[0].f[0].v}
    - get_job:
        call: googleapis.bigquery.v2.jobs.get
        args:
          projectId: ${project}
          jobId: ${load_job_id}
          location: "asia-southeast1"
        result: job
    - inspect:
        assign:
          - has_error: ${map.get(job, ["status", "errorResult"]) != null}
          - output_rows: ${default(map.get(job, ["statistics", "load", "outputRows"]), "0")}
          - bad_records: ${default(map.get(job, ["statistics", "load", "badRecords"]), "0")}
          - src_uris: ${default(map.get(job, ["configuration", "load", "sourceUris"]), [])}
          - src_join: ${json.encode_to_string(src_uris)}
          # The deployed loader streams bytes with a BigQuery media upload, so its LOAD job has
          # no sourceUris. URI-mode must match the exact object; MEDIA_UPLOAD-mode is bound by the
          # exactly-one run window, destination table, recorded bronze generation, and clean
          # terminal LOAD evidence above.
          - source_mode: ${if(len(src_uris) == 0, "MEDIA_UPLOAD", "URI")}
          - name_matches: ${if(len(src_uris) == 0, true, text.match_regex(src_join, text.replace_all(bronze_object_name, "/", "\\/")))}
    - gate_job:
        switch:
          - condition: ${has_error or bad_records != "0" or not name_matches}
            steps:
              - fail_job:
                  call: fail_closed
                  args:
                    project: ${project}
                    run_id: ${run_id}
                    alert_topic: ${alert_topic}
                    step: "LOAD_COMMITMENT"
                    reason: '${"LOAD job " + load_job_id + " failed audit: error=" + string(has_error) + "; badRecords=" + bad_records + "; sourceMatchesBronzeObject=" + string(name_matches)}'
    - log_commitment:
        call: write_run_log
        args:
          project: ${project}
          run_id: ${run_id}
          step: "LOAD_COMMITMENT"
          status: "SUCCESS"
          rows_out: ${int(output_rows)}
          detail: '${"jobId=" + load_job_id + "; outputRows=" + output_rows + "; badRecords=" + bad_records + "; sourceMode=" + source_mode + "; source=" + bronze_object_name + "@" + bronze_generation}'
    - out:
        return: true

# ----------------------------------------------------------------------
# Poll bronze prefix until empty or deadline (unchanged semantics; never retriggers).
# ----------------------------------------------------------------------
wait_bronze_empty:
  params: [project, run_id, alert_topic, bucket, prefix, deadline_seconds, poll_seconds]
  steps:
    - set_deadline:
        assign:
          - deadline: ${sys.now() + deadline_seconds}
    - poll:
        steps:
          - sleep:
              call: sys.sleep
              args:
                seconds: ${poll_seconds}
          - list_now:
              call: googleapis.storage.v1.objects.list
              args:
                bucket: ${bucket}
                prefix: ${prefix}
              result: now
          - census:
              assign:
                - n: ${len(default(map.get(now, "items"), []))}
          - decide:
              switch:
                - condition: ${n > 1}
                  steps:
                    - fail_second_object:
                        call: fail_closed
                        args:
                          project: ${project}
                          run_id: ${run_id}
                          alert_topic: ${alert_topic}
                          step: "LOADER_WAIT"
                          reason: '${"loader window contains " + string(n) + " objects; will not retrigger"}'
                - condition: ${n == 0}
                  steps:
                    - consumed:
                        call: write_run_log
                        args:
                          project: ${project}
                          run_id: ${run_id}
                          step: "LOADER_CONSUMED"
                          status: "SUCCESS"
                          rows_out: null
                          detail: "bronze object deleted by loader; commitment audit follows"
                    - out:
                        return: true
                - condition: ${sys.now() > deadline}
                  steps:
                    - fail_timeout:
                        call: fail_closed
                        args:
                          project: ${project}
                          run_id: ${run_id}
                          alert_topic: ${alert_topic}
                          step: "LOADER_WAIT"
                          reason: "loader timeout: bronze object still present; do NOT retrigger; inspect Cloud Run logs"
          - loop:
              next: poll

# ----------------------------------------------------------------------
# F5: mutating CALL with terminal polling. insert (async) -> poll jobs.get to
# DONE -> errorResult gate. On deadline: cancel, verify cancellation reached a
# terminal state, then fail. jobComplete=false can never strand a mutation.
# ----------------------------------------------------------------------
run_bq_call:
  params: [project, run_id, alert_topic, step, statement, timeout_seconds]
  steps:
    - dry_run:
        try:
          call: googleapis.bigquery.v2.jobs.insert
          args:
            projectId: ${project}
            body:
              configuration:
                dryRun: true
                query:
                  query: ${statement}
                  useLegacySql: false
        except:
          as: e
          steps:
            - fail_dry:
                call: fail_closed
                args:
                  project: ${project}
                  run_id: ${run_id}
                  alert_topic: ${alert_topic}
                  step: '${step + "_DRYRUN"}'
                  reason: ${json.encode_to_string(e)}
    # BigQuery job IDs permit only letters, digits, underscores, and dashes.
    # Keep the RFC timestamp-bearing run_id in audit rows, but sanitize it for jobReference.
    - prepare_job:
        assign:
          - job_id: ${text.replace_all_regex(run_id + "-" + step, "[^A-Za-z0-9_-]", "_")}
    - insert_job:
        try:
          call: googleapis.bigquery.v2.jobs.insert
          args:
            projectId: ${project}
            body:
              jobReference:
                projectId: ${project}
                location: "asia-southeast1"
                jobId: ${job_id}
              configuration:
                query:
                  query: ${statement}
                  useLegacySql: false
                  maximumBytesBilled: "21474836480"
          result: inserted
        except:
          as: e
          steps:
            - fail_insert:
                call: fail_closed
                args:
                  project: ${project}
                  run_id: ${run_id}
                  alert_topic: ${alert_topic}
                  step: ${step}
                  reason: ${json.encode_to_string(e)}
    - poll_setup:
        assign:
          - deadline: ${sys.now() + timeout_seconds}
          - final_state: ""
          - final_error: null
    - poll_job:
        steps:
          - wait_tick:
              call: sys.sleep
              args:
                seconds: 10
          - get_job:
              call: googleapis.bigquery.v2.jobs.get
              args:
                projectId: ${project}
                jobId: ${job_id}
                location: "asia-southeast1"
              result: jstate
          - read_state:
              assign:
                - final_state: ${default(map.get(jstate, ["status", "state"]), "")}
                - final_error: ${map.get(jstate, ["status", "errorResult"])}
          - branch:
              switch:
                - condition: ${final_state == "DONE" and final_error != null}
                  steps:
                    - fail_terminal:
                        call: fail_closed
                        args:
                          project: ${project}
                          run_id: ${run_id}
                          alert_topic: ${alert_topic}
                          step: ${step}
                          reason: '${"job " + job_id + " terminal error: " + json.encode_to_string(final_error)}'
                - condition: ${final_state == "DONE"}
                  steps:
                    - ok:
                        call: write_run_log
                        args:
                          project: ${project}
                          run_id: ${run_id}
                          step: ${step}
                          status: "SUCCESS"
                          rows_out: null
                          detail: '${"jobId=" + job_id + " DONE clean"}'
                    - out_ok:
                        return: true
                - condition: ${sys.now() > deadline}
                  steps:
                    - cancel:
                        try:
                          call: googleapis.bigquery.v2.jobs.cancel
                          args:
                            projectId: ${project}
                            jobId: ${job_id}
                            location: "asia-southeast1"
                        except:
                          as: ce
                          steps:
                            - note_cancel_failed:
                                assign:
                                  - _: "cancel call failed; still failing closed with job possibly running"
                    - wait_cancel_terminal:
                        next: poll_cancel
          - continue_poll:
              next: poll_job
    # jobs.cancel returns immediately. Never exit/release replay until jobs.get says DONE.
    - poll_cancel:
        steps:
          - wait_cancel_tick:
              call: sys.sleep
              args:
                seconds: 10
          - get_after_cancel:
              call: googleapis.bigquery.v2.jobs.get
              args:
                projectId: ${project}
                jobId: ${job_id}
                location: "asia-southeast1"
              result: after_cancel
          - read_after_cancel:
              assign:
                - cancel_state: ${default(map.get(after_cancel, ["status", "state"]), "")}
                - cancel_error: ${map.get(after_cancel, ["status", "errorResult"])}
          - gate_cancel_terminal:
              switch:
                - condition: ${cancel_state == "DONE"}
                  steps:
                    - fail_cancelled_terminal:
                        call: fail_closed
                        args:
                          project: ${project}
                          run_id: ${run_id}
                          alert_topic: ${alert_topic}
                          step: ${step}
                          reason: '${"job " + job_id + " exceeded " + string(timeout_seconds) + "s; cancellation reached terminal DONE; terminal_error=" + json.encode_to_string(cancel_error)}'
          - continue_cancel_poll:
              next: poll_cancel

# ----------------------------------------------------------------------
# F4: run-log rows use SUCCESS|FAILED and carry counts in rows_out; summary
# text lives in error_message per the existing 025 convention.
# ----------------------------------------------------------------------
write_run_log:
  params: [project, run_id, step, status, rows_out, detail]
  steps:
    - insert:
        call: googleapis.bigquery.v2.jobs.query
        args:
          projectId: ${project}
          body:
            query: "INSERT INTO `pacific-plating-282708.sap_integration_v3.pipeline_run_log` (run_id, run_type, step, scope, rows_in, rows_out, started_at, ended_at, status, error_message) VALUES (@run_id, 'NIGHTLY', @step, 'NIGHTLY:orchestrator', NULL, @rows_out, CURRENT_TIMESTAMP(), CURRENT_TIMESTAMP(), @status, @detail)"
            useLegacySql: false
            location: "asia-southeast1"
            parameterMode: "NAMED"
            queryParameters:
              - name: "run_id"
                parameterType: { type: "STRING" }
                parameterValue: { value: '${run_id}' }
              - name: "step"
                parameterType: { type: "STRING" }
                parameterValue: { value: '${step}' }
              - name: "status"
                parameterType: { type: "STRING" }
                parameterValue: { value: '${status}' }
              - name: "rows_out"
                parameterType: { type: "INT64" }
                parameterValue: { value: '${if(rows_out == null, null, string(rows_out))}' }
              - name: "detail"
                parameterType: { type: "STRING" }
                parameterValue: { value: '${detail}' }
    - out:
        return: true

# ----------------------------------------------------------------------
# Fail closed: record FAILED row (best effort) -> publish human alert -> raise.
# Alert failure still raises; only silent success is unacceptable.
# ----------------------------------------------------------------------
fail_closed:
  params: [project, run_id, alert_topic, step, reason]
  steps:
    - record_failed:
        try:
          call: write_run_log
          args:
            project: ${project}
            run_id: ${run_id}
            step: '${step + "_FAILED"}'
            status: "FAILED"
            rows_out: null
            detail: ${text.substring(reason, 0, 900)}
        except:
          as: ignored
          steps:
            - swallow_log_error:
                assign:
                  - _: "run-log write failed; alert still proceeds"
    - prepare_alert:
        assign:
          - alert_message:
              run_id: ${run_id}
              step: ${step}
              reason: ${reason}
          - alert_data: ${base64.encode(json.encode(alert_message))}
    - alert_human:
        call: googleapis.pubsub.v1.projects.topics.publish
        args:
          topic: ${alert_topic}
          body:
            messages:
              - data: ${alert_data}
    - raise_failure:
        raise: '${"V3 orchestrator failed closed at " + step + ": " + reason}'
