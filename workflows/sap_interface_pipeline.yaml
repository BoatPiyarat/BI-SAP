# sap_interface_pipeline.yaml
#
# Replaces the hand-written Python Cloud Function chain (rcb-motor-order-payment-sap-bucket-1,
# rcb-nonmotor-order-payment-sap-bucket-1) with a Cloud Workflows orchestration, per Boat's request
# (2026-07-26): "change the design to be triggered by previous process every night... recon before
# and after... if something failed, allow rerun 2nd time... split the running time to less" and,
# more specifically, "split the run time, eg. filter by period of data for all RCL newpayment
# timeout."
#
# Motivation: both Python functions run ALL their steps sequentially inside ONE function
# invocation sharing ONE timeout (Motor 300s, NonMotor 60s). Watched live the same day: Motor's
# last step (RCL newpayment) got killed mid-query by the shared timeout, losing that day's real
# newpayment file entirely; NonMotor nearly hit its own ceiling too (58.8s/60s). Splitting each
# interface file into its own independent step - each a plain `EXPORT DATA ... FROM sap_view.<view>`
# BigQuery job, not Python code - removes the shared-timeout failure mode structurally: a BigQuery
# export job isn't bound by a Cloud Function's timeout at all, and each step gets its own
# `retry: max_retries: 1`.
#
# The two RCL newpayment views specifically (Motor: ~648k rows, confirmed the slow/timing-out
# query when tested directly - ~100s+ just to scan; NonMotor: much smaller but complex
# RCL_HEALTH-joined query) are further split by Period range into 3 sub-exports each
# (Period 1-3 / 4-6 / 7+), based on the real row-count-by-period distribution checked for Motor
# (roughly even ~86k-104k per period across 1-6, tapering to ~10k-25k for 7-10) - each sub-export
# is now roughly a third of the original query's scan, and gets its own independent retry, so one
# slow period range failing doesn't require re-running the whole newpayment export.
#
# Also closes two known automation gaps found earlier the same day while investigating this:
# `RCL_Motor_process_3_cancel` and `RCL_Motor_process_4_creditshell` both exist as correct, working
# views but were never wired into the daily Motor chain - added as steps 07/08 here.
#
# Chain: extract job -> recon (before) -> Motor export steps (each retried once) -> NonMotor
# export steps (each retried once) -> recon (after).
#
# Caveat (told to Boat): "recon after" confirms the EXPORT step itself succeeded (query ran, file
# written) - it cannot confirm SAP has ACCEPTED the file, since SAP's own hourly pull/import runs
# later and independently. Real acceptance still needs a later/next-day check.
#
# NOT YET DONE: this workflow is deployed but not yet wired to Cloud Scheduler and the OLD
# Cloud Functions/scheduler jobs (sap-order-payment, sap-order-payment-non-motor) are NOT yet
# disabled - deliberately kept running in parallel until this workflow is proven reliable via
# manual test runs, per the standing "don't cut over live automation without verifying first" rule.
# Also currently blocked on an IAM grant (run.jobs.run for the extract step) - Boat has asked
# Attila to grant it.

main:
  params: [args]
  steps:
    - init:
        assign:
          - project_id: 'pacific-plating-282708'
          - region: 'asia-southeast1'
          - now: '${sys.now()}'
          - today: '${text.substring(time.format(now), 0, 10)}'
          - date_compact: '${text.replace_all(today, "-", "")}'
          # all steps EXCEPT the two RCL newpayment views, which are period-split below
          - motor_views:
              - { n: '01', v: 'RCB_Motor_process_create' }
              - { n: '02', v: 'RCB_Motor_process_2_cancel_new' }
              - { n: '03', v: 'RCB_Motor_process_3_change' }
              - { n: '04', v: 'RCB_Motor_process_4_creditshell' }
              - { n: '05', v: 'RCL_Motor_process_1_create' }
              - { n: '07', v: 'RCL_Motor_process_3_cancel' }
              - { n: '08', v: 'RCL_Motor_process_4_creditshell' }
          - nonmotor_views:
              - { n: '01', v: 'RCB_NonMotor_process_1_create' }
              - { n: '02', v: 'RCB_NonMotor_process_2_cancel' }
              - { n: '03', v: 'RCL_NonMotor_process_1_create' }
          # period-range splits for the two RCL newpayment views (Period 1-3 / 4-6 / 7+)
          - newpayment_splits:
              - { suffix: '_P1TO3', filter: ' WHERE Period BETWEEN 1 AND 3' }
              - { suffix: '_P4TO6', filter: ' WHERE Period BETWEEN 4 AND 6' }
              - { suffix: '_P7PLUS', filter: ' WHERE Period >= 7' }

    - run_extract:
        call: run_extract_job
        args:
          project_id: '${project_id}'
          region: '${region}'

    - recon_before:
        call: run_bq_query_and_wait
        args:
          project_id: '${project_id}'
          query: '${"CALL `" + project_id + ".sap_integration_v3.sp_nightly_state_and_recon_refresh`()"}'

    - export_motor_loop:
        for:
          value: item
          in: '${motor_views}'
          steps:
            - do_export_motor:
                try:
                  call: export_view_to_gcs
                  args:
                    project_id: '${project_id}'
                    step_num: '${item.n}'
                    view_name: '${item.v}'
                    folder: 'RCB_MOTOR'
                    date_compact: '${date_compact}'
                    file_suffix: ''
                    period_filter_sql: ''
                retry:
                  predicate: ${always_retry_once}
                  max_retries: 1
                  backoff:
                    initial_delay: 10
                    max_delay: 30
                    multiplier: 2

    - export_motor_newpayment_loop:
        for:
          value: split
          in: '${newpayment_splits}'
          steps:
            - do_export_motor_newpayment:
                try:
                  call: export_view_to_gcs
                  args:
                    project_id: '${project_id}'
                    step_num: '06'
                    view_name: 'RCL_Motor_process_2_newpayment'
                    folder: 'RCB_MOTOR'
                    date_compact: '${date_compact}'
                    file_suffix: '${split.suffix}'
                    period_filter_sql: '${split.filter}'
                retry:
                  predicate: ${always_retry_once}
                  max_retries: 1
                  backoff:
                    initial_delay: 10
                    max_delay: 30
                    multiplier: 2

    - export_nonmotor_loop:
        for:
          value: item
          in: '${nonmotor_views}'
          steps:
            - do_export_nonmotor:
                try:
                  call: export_view_to_gcs
                  args:
                    project_id: '${project_id}'
                    step_num: '${item.n}'
                    view_name: '${item.v}'
                    folder: 'RCB_NONMOTOR'
                    date_compact: '${date_compact}'
                    file_suffix: ''
                    period_filter_sql: ''
                retry:
                  predicate: ${always_retry_once}
                  max_retries: 1
                  backoff:
                    initial_delay: 10
                    max_delay: 30
                    multiplier: 2

    - export_nonmotor_newpayment_loop:
        for:
          value: split
          in: '${newpayment_splits}'
          steps:
            - do_export_nonmotor_newpayment:
                try:
                  call: export_view_to_gcs
                  args:
                    project_id: '${project_id}'
                    step_num: '04'
                    view_name: 'RCL_NonMotor_process_2_newpayment'
                    folder: 'RCB_NONMOTOR'
                    date_compact: '${date_compact}'
                    file_suffix: '${split.suffix}'
                    period_filter_sql: '${split.filter}'
                retry:
                  predicate: ${always_retry_once}
                  max_retries: 1
                  backoff:
                    initial_delay: 10
                    max_delay: 30
                    multiplier: 2

    - recon_after:
        call: run_bq_query_and_wait
        args:
          project_id: '${project_id}'
          query: '${"CALL `" + project_id + ".sap_integration_v3.sp_nightly_state_and_recon_refresh`()"}'

    - finish:
        return: 'SAP interface pipeline complete'

# --- Retry predicate: always allow the one retry, regardless of failure reason ---
# (Boat: "if something failed, allow rerun 2nd time" - literal, not conditional on error type)

always_retry_once:
  params: [e]
  steps:
    - retry_regardless:
        return: true

# --- Cloud Run Job (extract) helpers ---

run_extract_job:
  params: [project_id, region]
  steps:
    - start_execution:
        call: http.post
        args:
          url: '${"https://run.googleapis.com/v2/projects/" + project_id + "/locations/" + region + "/jobs/sap-extract-job:run"}'
          auth:
            type: OAuth2
        result: exec_result
    - get_execution_name:
        assign:
          - execution_name: '${exec_result.body.metadata.name}'
    - poll_extract:
        call: poll_run_execution
        args:
          execution_name: '${execution_name}'

poll_run_execution:
  params: [execution_name]
  steps:
    - loop:
        steps:
          - sleep_step:
              call: sys.sleep
              args:
                seconds: 15
          - check_status:
              call: http.get
              args:
                url: '${"https://run.googleapis.com/v2/" + execution_name}'
                auth:
                  type: OAuth2
              result: status_result
          - evaluate:
              switch:
                - condition: '${"completionTime" in status_result.body and "failedCount" in status_result.body and status_result.body.failedCount > 0}'
                  raise: '${"extract job execution failed - " + json.encode_to_string(status_result.body)}'
                - condition: '${"completionTime" in status_result.body}'
                  next: done
                - condition: true
                  next: loop
    - done:
        return: true

# --- BigQuery job helpers (used for both recon calls and EXPORT DATA steps) ---

run_bq_query_and_wait:
  params: [project_id, query]
  steps:
    - submit_job:
        call: googleapis.bigquery.v2.jobs.insert
        args:
          projectId: '${project_id}'
          body:
            configuration:
              query:
                query: '${query}'
                useLegacySql: false
        result: job_insert_result
    - extract_job_id:
        assign:
          - job_id: '${job_insert_result.jobReference.jobId}'
    - poll_job:
        call: poll_bq_job
        args:
          project_id: '${project_id}'
          job_id: '${job_id}'

poll_bq_job:
  params: [project_id, job_id]
  steps:
    - loop:
        steps:
          - sleep_step:
              call: sys.sleep
              args:
                seconds: 5
          - check_status:
              call: googleapis.bigquery.v2.jobs.get
              args:
                projectId: '${project_id}'
                jobId: '${job_id}'
              result: job_status
          - evaluate:
              switch:
                - condition: '${job_status.status.state == "DONE" and "errorResult" in job_status.status}'
                  raise: '${job_status.status.errorResult}'
                - condition: '${job_status.status.state == "DONE"}'
                  next: done
                - condition: true
                  next: loop
    - done:
        return: true

# --- Per-view export step ---
# period_filter_sql: empty string for a normal full-view export, or " WHERE Period BETWEEN X AND Y"
# (leading space required) for a period-range sub-export. file_suffix: empty string normally, or a
# distinguishing suffix (e.g. "_P1TO3") so period-range sub-exports of the SAME view don't
# overwrite each other's GCS object.

export_view_to_gcs:
  params: [project_id, step_num, view_name, folder, date_compact, file_suffix, period_filter_sql]
  steps:
    - build_query:
        assign:
          - uri: '${"gs://interface-file/" + folder + "/INSURANCE_RCB_" + step_num + "_" + view_name + file_suffix + "_" + date_compact + "*.csv"}'
          - sql: '${"EXPORT DATA OPTIONS(uri=\"" + uri + "\", format=\"CSV\", overwrite=true, header=true) AS SELECT * FROM `" + project_id + ".sap_view." + view_name + "`" + period_filter_sql}'
    - run_it:
        call: run_bq_query_and_wait
        args:
          project_id: '${project_id}'
          query: '${sql}'
